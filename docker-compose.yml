version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: petpooja_postgres
    restart: always
    environment:
      POSTGRES_USER: petpooja_user
      POSTGRES_PASSWORD: petpooja_password
      POSTGRES_DB: petpooja_middleware
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petpooja_middleware_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://petpooja_user:petpooja_password@db:5432/petpooja_middleware"
      APP_URL: "http://localhost:3000"
      PETPOOJA_ENV: "staging"
      PETPOOJA_APP_KEY: "rps3igv8ucfhydx01ao6k9ebnz75tqw4"
      PETPOOJA_APP_SECRET: "71b70724b84d8d8ea06fe9cc0da105b07c412228"
      PETPOOJA_ACCESS_TOKEN: "7337c1365cf2e61fe5f2b9f8d445db00dc6c39a1"
      PETPOOJA_REST_ID: "SAMPLE_REST_101"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
